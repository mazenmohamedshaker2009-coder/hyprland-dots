"$schema" = "https://yazi-rs.github.io/schemas/theme.json"

[manager]
cwd = { fg = "{{colors.primary.default.hex}}" }

hovered = { fg = "{{colors.on_secondary_container.default.hex}}", bg = "{{colors.secondary_container.default.hex}}" }
preview_hovered = { underline = true }

find_keyword = { fg = "{{colors.tertiary.default.hex}}", italic = true }
find_position = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }

marker_selected = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
marker_copied = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
marker_cut = { fg = "{{colors.error.default.hex}}", bg = "{{colors.error.default.hex}}" }

tab_active = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
tab_inactive = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

border_symbol = "│"
border_style = { fg = "{{colors.outline.default.hex}}" }

[count]
fg = "{{colors.primary.default.hex}}"

[status]
separator_open = ""
separator_close = ""

mode_normal = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
mode_select = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}", bold = true }
mode_unset = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface.default.hex}}", bold = true }

[selection]
fg = "{{colors.on_secondary_container.default.hex}}"
bg = "{{colors.secondary_container.default.hex}}"

[input]
border = { fg = "{{colors.primary.default.hex}}" }

[completion]
border = { fg = "{{colors.outline.default.hex}}" }
active = { bg = "{{colors.surface_container_high.default.hex}}" }

[tasks]
border = { fg = "{{colors.outline.default.hex}}" }
hovered = { fg = "{{colors.primary.default.hex}}" }

[which]
mask = { bg = "{{colors.surface.default.hex}}" }
cand = { fg = "{{colors.primary.default.hex}}" }
desc = { fg = "{{colors.on_surface_variant.default.hex}}" }
separator = " → "

[help]
on = { fg = "{{colors.primary.default.hex}}" }
run = { fg = "{{colors.secondary.default.hex}}" }
desc = { fg = "{{colors.on_surface_variant.default.hex}}" }
hovered = { bg = "{{colors.surface_container.default.hex}}" }

[filetype]
rules = []
